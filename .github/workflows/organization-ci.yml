name: Organization CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  hygiene:
    uses: calan-co/cicd-shared-pipeline/.github/workflows/reusable-repository-hygiene.yml@v1
  container:
    uses: calan-co/cicd-shared-pipeline/.github/workflows/reusable-container-ci.yml@v1
    with:
      build-command: docker build --build-arg FROM=docker.io/ubuntu:24.04 --tag calan-co/netbox-docker:ci .
